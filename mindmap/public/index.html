<style>html,body{margin:0;height:100%;font:16px system-ui;background:#fafafa}body{display:flex;flex-direction:column}header{padding:12px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:1px solid #ddd}button,select{padding:8px;font:inherit;max-width:100%;cursor:pointer}#mindmap{width:100%;flex:1;min-height:0}small{color:#555}label{display:flex;align-items:center;gap:8px;max-width:100%}.current-step{background:#eef0f2;color:#303840;border:1px solid #89939d;border-radius:5px;padding:3px 6px;display:inline-block}.task-running,.task-review,.task-accepted,.task-failed{border:2px solid;border-radius:5px;padding:3px 6px;display:inline-block}.task-running{background:#ffdf32;color:#362900;border-color:#966500}.task-review{background:#ff9800;color:#542600;border-color:#b85c00}.task-accepted{background:#65cf80;color:#123b1e;border-color:#28773e}.task-failed{background:#ff7979;color:#5b1111;border-color:#b32b2b}#mindmap .markmap-node:has(.task-running)>line,#mindmap .markmap-node:has(.task-running)>circle{stroke:#966500}#mindmap .markmap-node:has(.task-running)>circle{fill:#966500}#mindmap .markmap-node:has(.task-review)>line,#mindmap .markmap-node:has(.task-review)>circle{stroke:#b85c00}#mindmap .markmap-node:has(.task-review)>circle{fill:#b85c00}#mindmap .markmap-node:has(.task-accepted)>line,#mindmap .markmap-node:has(.task-accepted)>circle{stroke:#28773e}#mindmap .markmap-node:has(.task-accepted)>circle{fill:#28773e}#mindmap .markmap-node:has(.task-failed)>line,#mindmap .markmap-node:has(.task-failed)>circle{stroke:#b32b2b}#mindmap .markmap-node:has(.task-failed)>circle{fill:#b32b2b}/* Fill the actual Markmap HTML label, including wrapped lines. */
#mindmap foreignObject.markmap-foreign > div > div:has(> strong[class^="task-"]){border-radius:5px;background:var(--task-bg);color:var(--task-fg)}
#mindmap foreignObject.markmap-foreign > div > div:has(> .task-queued){--task-bg:#ffdf32;--task-fg:#362900}
#mindmap foreignObject.markmap-foreign > div > div:has(> .task-running){--task-bg:#ffdf32;--task-fg:#362900}
#mindmap foreignObject.markmap-foreign > div > div:has(> .task-review){--task-bg:#ff9800;--task-fg:#542600}
#mindmap foreignObject.markmap-foreign > div > div:has(> .task-accepted){--task-bg:#65cf80;--task-fg:#123b1e}
#mindmap foreignObject.markmap-foreign > div > div:has(> .task-failed){--task-bg:#ff7979;--task-fg:#5b1111}
#mindmap foreignObject strong[class^="task-"]{display:block;box-sizing:border-box;width:100%;background:var(--task-bg);color:var(--task-fg)}
#current-tasks{flex-shrink:0;max-height:26vh;overflow:auto;padding:8px 20px;border-bottom:1px solid #bbb}#current-tasks>button{padding:3px 8px;font-size:13px}.task-queued{background:#ffdf32;color:#362900;border:2px solid #966500;border-radius:5px;padding:3px 6px}#current-tasks>div{display:block;margin:5px 0;overflow-wrap:anywhere} </style>
